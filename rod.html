<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Род Ступко — вход</title>
<meta name="robots" content="noindex">
<style>
:root{
  --brand:#43836d; --brand-dark:#2F5D4E; --mint:#7ac1a8;
  --sepia:#8a5a2b; --gold:#c9a227;
  --bg:#f4f1ea; --surface:#fffdf8; --surface-2:#efeadf;
  --ink:#1d2b26; --ink-2:#4a5c55; --line:#e2dccf;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --font:'Avenir Next','Century Gothic',-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131816; --surface:#1b2220; --surface-2:#232b28;
    --ink:#eef2ef; --ink-2:#a9b8b1; --line:#2d3733;
    --brand:#7ac1a8; --brand-dark:#9ad4bd; --sepia:#d2a06a; --gold:#e0bf5a;
  }
}
:root[data-theme="dark"]{
  --bg:#131816; --surface:#1b2220; --surface-2:#232b28;
  --ink:#eef2ef; --ink-2:#a9b8b1; --line:#2d3733;
  --brand:#7ac1a8; --brand-dark:#9ad4bd; --sepia:#d2a06a; --gold:#e0bf5a;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.js .rv{opacity:0;transform:translateY(8px);transition:opacity .28s var(--ease-out),transform .28s var(--ease-out)}
.js .rv.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.js .rv{transform:none;transition:opacity .2s linear}html{scroll-behavior:auto}}
header{padding:72px 0 44px}
.eyebrow{display:inline-block;font-size:13px;font-weight:700;color:var(--brand-dark);background:rgba(67,131,109,.12);padding:7px 14px;border-radius:999px}
h1{font-size:52px;line-height:1.05;font-weight:700;margin:22px 0 14px;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--brand)}
.lede{font-size:19px;line-height:1.55;color:var(--ink-2);max-width:660px;margin:0}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:40px 0 0}
.numcard{background:var(--surface);border-radius:16px;padding:22px 16px;text-align:center}
.numcard b{display:block;font-size:40px;line-height:1;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}
.numcard span{display:block;margin-top:8px;font-size:13px;color:var(--ink-2)}
section{padding:56px 0}
h2{font-size:30px;font-weight:700;margin:0 0 6px;letter-spacing:-.01em}
.sub{font-size:14px;color:var(--ink-2);margin:0 0 30px}
h3{font-size:19px;font-weight:700;margin:0 0 6px;color:var(--brand-dark)}
.tree{position:relative;padding-left:76px}
.tree::before{content:"";position:absolute;left:27px;top:12px;bottom:12px;width:2px;background:linear-gradient(180deg,transparent,var(--mint) 8%,var(--mint) 92%,transparent)}
.gen{position:relative;margin-bottom:34px}
.rim{position:absolute;left:-76px;top:2px;width:56px;height:56px;border-radius:50%;background:var(--surface);color:var(--brand-dark);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;border:2px solid var(--mint)}
.gent{font-weight:700;font-size:15px;color:var(--brand-dark)}
.geny{font-size:13px;color:var(--ink-2);margin:0 0 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:14px}
.p{background:var(--surface);border-radius:16px;padding:16px;display:flex;gap:14px;align-items:flex-start}
.p.direct{box-shadow:inset 3px 0 0 var(--brand)}
.p.ghost{background:var(--surface-2);border:1px dashed var(--line)}
.p img{width:84px;height:105px;object-fit:cover;border-radius:10px;flex:none;background:var(--surface-2)}
.p b{display:block;font-size:15px;font-weight:700;line-height:1.3}
.p .yr{font-size:13px;color:var(--brand);font-variant-numeric:tabular-nums;font-weight:700}
.p .role{font-size:13px;color:var(--ink-2);margin-top:4px}
.p .pl{font-size:12px;color:var(--ink-2);margin-top:6px;opacity:.85}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.step{background:var(--surface);border-radius:16px;padding:22px 20px}
.step .k{font-size:13px;font-weight:700;color:var(--brand);margin-bottom:6px}
.step p{margin:0;font-size:14px;color:var(--ink-2)}
.note{border-radius:16px;padding:22px 24px;margin:18px 0;background:var(--surface)}
.note.accent{box-shadow:inset 3px 0 0 var(--brand)}
.gate{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;background:var(--surface);border-radius:20px;padding:32px}
.gate p{margin:0 0 10px;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;
  background:rgba(67,131,109,.14);color:var(--brand-dark);border:1px solid rgba(67,131,109,.35);transition:background .25s var(--ease-out),transform .25s var(--ease-out),box-shadow .25s var(--ease-out)}
.btn:hover{background:rgba(67,131,109,.24);transform:translateY(-1px);box-shadow:0 8px 24px rgba(47,93,78,.16)}
.btn.ghost{background:transparent}
.field{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:17px;letter-spacing:.02em}
.field:focus{outline:2px solid var(--brand);outline-offset:2px;border-color:transparent}
.err{color:#a8432f;font-size:14px;margin-top:10px;min-height:20px}
.bar{height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:14px;opacity:0;transition:opacity .25s}
.bar.on{opacity:1}
.bar i{display:block;height:100%;width:30%;background:var(--mint);border-radius:4px;animation:slide 1.1s var(--ease-out) infinite}
@keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(400%)}}
a{color:var(--brand-dark);text-decoration-thickness:1px;text-underline-offset:3px}
footer{padding:48px 0 80px;color:var(--ink-2);font-size:13px;border-top:1px solid var(--line)}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
::selection{background:var(--gold);color:#1d2b26}
@media (max-width:760px){h1{font-size:38px}.nums{grid-template-columns:repeat(2,1fr)}.gate{grid-template-columns:1fr}.tree{padding-left:56px}.rim{left:-56px;width:42px;height:42px;font-size:14px}}

</style>
</head>
<body>
<script>document.documentElement.classList.add('js');</script>
<div class="wrap">
<header>
  <span class="eyebrow rv">Подробная история рода</span>
  <h1 class="rv">Род <em>Ступко</em></h1>
  <p class="lede rv">Эта страница открывается по личному паролю. Страница расшифровывается прямо в браузере, на сервер пароль не уходит.</p>
</header>
<section style="padding-top:0">
  <div class="gate rv">
    <form id="f" autocomplete="off">
      <label for="pw" style="display:block;font-weight:700;margin-bottom:10px">Пароль</label>
      <input class="field" id="pw" type="password" autocomplete="current-password" placeholder="три слова и число" required>
      <div class="err" id="err"></div>
      <div class="bar" id="bar"><i></i></div>
      <div style="margin-top:16px;display:flex;gap:12px;flex-wrap:wrap">
        <button class="btn" type="submit" id="go">Открыть</button>
        <a class="btn ghost" href="index.html">На главную</a>
      </div>
    </form>
    <div>
      <p>Нет пароля? Попросите у Павла: <a href="https://t.me/pgstupko">t.me/pgstupko</a>.</p>
      <p>Страница большая — около 4 МБ. На телефоне открывается 5–10 секунд.</p>
    </div>
  </div>
</section>
</div>
<script>(function(){
  var els=document.querySelectorAll('.rv');
  if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('on');});return;}
  var io=new IntersectionObserver(function(en){en.forEach(function(x,i){if(!x.isIntersecting)return;var el=x.target;setTimeout(function(){el.classList.add('on');},Math.min(i,6)*50);io.unobserve(el);});},{rootMargin:'0px 0px -8% 0px',threshold:0.05});
  els.forEach(function(e){io.observe(e);});
  setTimeout(function(){els.forEach(function(e){e.classList.add('on');});},2200);
})();
</script>
<script>
(function(){
  var f=document.getElementById('f'), pw=document.getElementById('pw'), err=document.getElementById('err'),
      bar=document.getElementById('bar'), go=document.getElementById('go');
  function ub64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
  function b64(a){var s='';a=new Uint8Array(a);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
  var dataP=null;
  function data(){ return dataP || (dataP=fetch('rod.enc.json',{cache:'force-cache'}).then(function(r){return r.json();})); }
  function render(html){
    document.open(); document.write(html); document.close();
  }
  async function decrypt(rawKey, d){
    var k=await crypto.subtle.importKey('raw',rawKey,'AES-GCM',false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(d.iv)},k,ub64(d.ct));
    return new TextDecoder().decode(pt);
  }
  async function unwrap(password, d){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
    for (var i=0;i<d.keys.length;i++){
      var e=d.keys[i];
      var kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub64(e.salt),iterations:d.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
      try { return await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(e.iv)},kek,ub64(e.w)); } catch(_){}
    }
    return null;
  }
  async function openWith(rawKey){
    var d=await data(); var html=await decrypt(rawKey,d);
    try{ sessionStorage.setItem('stupko_k', b64(rawKey)); }catch(_){}
    render(html);
  }
  f.addEventListener('submit', async function(ev){
    ev.preventDefault(); err.textContent=''; bar.classList.add('on'); go.disabled=true;
    try{
      var d=await data();
      var raw=await unwrap(pw.value.trim().toLowerCase().replace(/\s+/g,'-'), d);
      if(!raw){ err.textContent='Пароль не подошёл. Проверьте дефисы и число.'; pw.select(); }
      else await openWith(raw);
    }catch(e){ err.textContent='Не удалось открыть: '+(e.message||e); }
    bar.classList.remove('on'); go.disabled=false;
  });
  try{
    var saved=sessionStorage.getItem('stupko_k');
    if(saved){ bar.classList.add('on'); openWith(ub64(saved)).catch(function(){ bar.classList.remove('on'); }); }
  }catch(_){}
  pw.focus();
})();
</script>
</body>
</html>
